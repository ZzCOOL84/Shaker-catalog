<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salt & Pepper — Каталог</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f5f0e8; --warm: #e8dfd0; --border: #c8b89a;
  --ink: #2a1f14; --muted: #7a6a58; --accent: #8b3a2a;
  --accent2: #4a6741; --card-bg: #faf7f2;
  --shadow: 0 2px 12px rgba(42,31,20,0.10); --radius: 6px;
}
body { background: var(--cream); font-family: 'DM Mono', monospace; color: var(--ink); min-height: 100vh; }
.app { max-width: 900px; margin: 0 auto; padding: 0 0 80px 0; }

.header { background: var(--ink); color: var(--cream); padding: 22px 20px 16px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--accent); }
.header h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; font-weight: 600; }
.header-sub { font-size: 0.68rem; color: var(--border); letter-spacing: 0.08em; text-transform: uppercase; margin-left: 12px; }
.stat { font-size: 0.7rem; color: var(--warm); margin-top: 6px; }
.stat b { color: #fff; font-size: 1rem; margin-right: 3px; font-family: 'Cormorant Garamond', serif; }

.nav { display: flex; background: var(--warm); border-bottom: 2px solid var(--border); overflow-x: auto; }
.nav-btn { padding: 10px 16px; font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; background: none; border: none; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: all 0.15s; }
.nav-btn:hover { color: var(--ink); }
.nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--cream); }

.main { padding: 18px 14px; }
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-box { flex: 1; min-width: 160px; padding: 8px 12px; font-family: 'DM Mono', monospace; font-size: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card-bg); color: var(--ink); outline: none; }
.search-box:focus { border-color: var(--accent); }

.btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: all 0.15s; text-transform: uppercase; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #6e2e21; }
.btn-secondary { background: none; color: var(--ink); border-color: var(--border); }
.btn-secondary:hover { background: var(--warm); }
.btn-danger { background: none; color: var(--accent); border-color: var(--accent); }
.btn-danger:hover { background: #f9ece9; }
.btn-sm { padding: 5px 10px; font-size: 0.63rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s; }
.card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.card-img { width: 100%; height: 150px; background: var(--warm); display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 2rem; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 10px; }
.card-num { font-size: 0.63rem; color: var(--muted); }
.card-title { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; margin: 2px 0 3px; line-height: 1.3; }
.card-meta { font-size: 0.63rem; color: var(--muted); }
.card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.tag { display: inline-block; padding: 2px 6px; font-size: 0.58rem; border-radius: 20px; background: var(--warm); border: 1px solid var(--border); color: var(--muted); }

.groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.group-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.group-card-name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; }
.group-card-count { font-size: 0.66rem; color: var(--muted); margin-top: 3px; }
.group-card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty p { font-size: 0.82rem; margin-bottom: 16px; }

/* MODAL */
.overlay { position: fixed; inset: 0; background: rgba(42,31,20,0.6); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 16px 12px; overflow-y: auto; }
.modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 560px; padding: 22px; position: relative; margin: auto; }
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; margin-bottom: 18px; }
.modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); line-height: 1; }

.form-row { margin-bottom: 12px; }
.form-label { display: block; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.form-input, .form-textarea, .form-select { width: 100%; padding: 8px 10px; font-family: 'DM Mono', monospace; font-size: 0.78rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--cream); color: var(--ink); outline: none; }
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
.form-textarea { min-height: 70px; resize: vertical; }
.form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

/* PHOTO UPLOAD */
.photo-upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; color: var(--muted); font-size: 0.72rem; cursor: pointer; transition: border-color 0.15s; line-height: 1.6; }
.photo-upload-area:hover { border-color: var(--accent); }
.photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.photo-thumb { position: relative; width: 68px; height: 68px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.65); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 0.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* GROUP PICKER */
.group-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.group-chip { padding: 4px 10px; font-size: 0.63rem; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--warm); color: var(--muted); transition: all 0.12s; }
.group-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

/* DETAIL */
.detail-photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
.detail-photo { flex: 0 0 auto; width: 180px; height: 180px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; }
.detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.detail-cell { padding: 9px 12px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.detail-cell:nth-child(even) { border-right: none; }
.detail-field-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.detail-field-value { font-size: 0.85rem; margin-top: 2px; }
.detail-notes { margin-bottom: 12px; }

/* LIGHTBOX */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400; display: flex; align-items: center; justify-content: center; }
.lightbox img { max-width: 96vw; max-height: 92vh; object-fit: contain; }
.lightbox-close { position: fixed; top: 14px; right: 18px; color: #fff; font-size: 1.8rem; cursor: pointer; background: none; border: none; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--warm); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 480px) {
  .form-grid2 { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .detail-cell { border-right: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div style="display:flex;align-items:baseline;gap:12px">
      <h1>Salt & Pepper</h1>
      <span class="header-sub">Каталог коллекции</span>
    </div>
    <div class="stat"><b id="total-count">0</b> наборов всего</div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="main" id="main"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- MODALS -->
<div class="overlay" id="overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
let items = JSON.parse(localStorage.getItem('sp-items') || '[]');
let groups = JSON.parse(localStorage.getItem('sp-groups') || '[]');
let currentTab = 'all';
let searchQuery = '';

function save() {
  localStorage.setItem('sp-items', JSON.stringify(items));
  localStorage.setItem('sp-groups', JSON.stringify(groups));
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('total-count').textContent = items.length;
  renderNav();
  renderMain();
}

function renderNav() {
  const nav = document.getElementById('nav');
  let html = `<button class="nav-btn ${currentTab==='all'?'active':''}" onclick="setTab('all')">Все</button>`;
  html += `<button class="nav-btn ${currentTab==='groups'?'active':''}" onclick="setTab('groups')">Группы</button>`;
  groups.forEach(g => {
    html += `<button class="nav-btn ${currentTab===g.id?'active':''}" onclick="setTab('${g.id}')">${esc(g.name)}</button>`;
  });
  nav.innerHTML = html;
}

function renderMain() {
  const main = document.getElementById('main');
  if (currentTab === 'groups') { renderGroups(main); return; }
  renderItems(main);
}

function renderItems(container) {
  let list = items;
  if (currentTab !== 'all') list = list.filter(i => (i.groups||[]).includes(currentTab));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(i => (i.title||'').toLowerCase().includes(q) || (i.country||'').toLowerCase().includes(q) || (i.maker||'').toLowerCase().includes(q) || (i.notes||'').toLowerCase().includes(q));
  }
  const activeGroup = currentTab !== 'all' ? groups.find(g => g.id === currentTab) : null;
  let html = `<div class="toolbar">
    <input class="search-box" placeholder="Поиск…" value="${esc(searchQuery)}" oninput="searchQuery=this.value;renderMain()">
    <button class="btn btn-primary" onclick="openAddItem()">+ Добавить набор</button>
  </div>`;
  if (activeGroup) html += `<div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;margin-bottom:14px">${esc(activeGroup.name)} <span style="font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted);font-weight:400">${list.length} наборов</span></div>`;
  if (list.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🧂</div><p>${searchQuery ? 'Ничего не найдено.' : 'Наборов пока нет. Добавьте первый!'}</p>${!searchQuery ? '<button class="btn btn-primary" onclick="openAddItem()">+ Добавить первый набор</button>' : ''}</div>`;
  } else {
    html += '<div class="grid">';
    list.forEach(item => { html += renderCard(item); });
    html += '</div>';
  }
  container.innerHTML = html;
}

function renderCard(item) {
  const thumb = item.photos && item.photos[0];
  const itemGroups = (item.groups||[]).map(gid => groups.find(g => g.id===gid)).filter(Boolean);
  return `<div class="card" onclick="openDetail('${item.id}')">
    <div class="card-img">${thumb ? `<img src="${thumb}" alt="">` : '🧂'}</div>
    <div class="card-body">
      <div class="card-num">#${item.num} · ${esc(item.year||'—')} · ${esc(item.country||'—')}</div>
      <div class="card-title">${esc(item.title||'Без названия')}</div>
      <div class="card-meta">${esc(item.maker||'')}</div>
      ${itemGroups.length ? `<div class="card-tags">${itemGroups.map(g=>`<span class="tag">${esc(g.name)}</span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

function renderGroups(container) {
  let html = `<div class="toolbar">
    <div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;flex:1">Группы</div>
    <button class="btn btn-primary" onclick="openAddGroup()">+ Новая группа</button>
  </div>`;
  if (groups.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📂</div><p>Групп пока нет.</p><button class="btn btn-primary" onclick="openAddGroup()">+ Создать первую группу</button></div>`;
  } else {
    html += '<div class="groups-grid">';
    groups.forEach(g => {
      const count = items.filter(i => (i.groups||[]).includes(g.id)).length;
      html += `<div class="group-card">
        <div class="group-card-name">${esc(g.name)}</div>
        <div class="group-card-count">${count} наборов</div>
        <div class="group-card-actions">
          <button class="btn btn-secondary btn-sm" onclick="setTab('${g.id}')">Открыть</button>
          <button class="btn btn-secondary btn-sm" onclick="openEditGroup('${g.id}')">Изменить</button>
          <button class="btn btn-danger btn-sm" onclick="deleteGroup('${g.id}')">Удалить</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  container.innerHTML = html;
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function setTab(tab) { currentTab = tab; searchQuery = ''; render(); }

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('overlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('overlay').style.display = 'none';
}

// ─── ADD/EDIT ITEM ────────────────────────────────────────────────────────────
let editingItem = null;
let editingPhotos = [];

function openAddItem() { editingItem = null; editingPhotos = []; showItemForm(); }
function openEditItem(id) { editingItem = items.find(i => i.id===id); editingPhotos = [...(editingItem.photos||[])]; showItemForm(); }

function showItemForm() {
  const it = editingItem || {};
  const groupChips = groups.map(g => `<span class="group-chip ${(it.groups||[]).includes(g.id)?'selected':''}" onclick="toggleGroupChip(this,'${g.id}')" data-gid="${g.id}">${esc(g.name)}</span>`).join('');
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${editingItem ? 'Редактировать набор' : 'Новый набор'}</div>
    <div class="form-row">
      <label class="form-label">Название *</label>
      <input class="form-input" id="f-title" value="${esc(it.title||'')}" placeholder="напр. Коты в шляпах…">
    </div>
    <div class="form-grid2">
      <div class="form-row">
        <label class="form-label">Год</label>
        <input class="form-input" id="f-year" value="${esc(it.year||'')}" placeholder="1952">
      </div>
      <div class="form-row">
        <label class="form-label">Страна</label>
        <input class="form-input" id="f-country" value="${esc(it.country||'')}" placeholder="Германия">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Производитель</label>
      <input class="form-input" id="f-maker" value="${esc(it.maker||'')}" placeholder="напр. Carlton Ware…">
    </div>
    <div class="form-grid2">
      <div class="form-row">
        <label class="form-label">Состояние</label>
        <select class="form-select" id="f-condition">
          <option value="">—</option>
          ${['Идеальное','Хорошее','Удовлетворительное','Повреждённое','Неизвестно'].map(o=>`<option ${it.condition===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Как получено</label>
        <select class="form-select" id="f-acquired">
          <option value="">—</option>
          ${['Покупка','Подарок','Аукцион','Обмен','По наследству','Находка','Другое'].map(o=>`<option ${it.acquired===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Оценочная стоимость ($)</label>
      <input class="form-input" id="f-value" value="${esc(it.value||'')}" placeholder="Оставьте пустым, если неизвестно">
    </div>
    <div class="form-row">
      <label class="form-label">Заметки</label>
      <textarea class="form-textarea" id="f-notes" placeholder="Доп. информация, провенанс, маркировки…">${esc(it.notes||'')}</textarea>
    </div>
    <div class="form-row">
      <label class="form-label">Фотографии</label>
      <label class="photo-upload-area" for="f-photos-input" style="display:block">
        📷 Нажмите, чтобы выбрать фото из галереи
        <input type="file" id="f-photos-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(this)">
      </label>
      <div class="photo-thumbs" id="photo-thumbs-container"></div>
    </div>
    ${groups.length ? `<div class="form-row"><label class="form-label">Группы</label><div class="group-picker">${groupChips}</div></div>` : ''}
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveItem()">Сохранить</button>
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    </div>
  `);
  renderPhotoThumbs();
}

function handlePhotoUpload(input) {
  const files = Array.from(input.files);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      editingPhotos.push(e.target.result);
      loaded++;
      if (loaded === files.length) renderPhotoThumbs();
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoThumbs() {
  const container = document.getElementById('photo-thumbs-container');
  if (!container) return;
  container.innerHTML = editingPhotos.map((src, i) =>
    `<div class="photo-thumb"><img src="${src}" alt=""><button class="photo-del" onclick="removePhoto(${i})">✕</button></div>`
  ).join('');
}

function removePhoto(i) {
  editingPhotos.splice(i, 1);
  renderPhotoThumbs();
}

function toggleGroupChip(el, gid) {
  el.classList.toggle('selected');
}

function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Пожалуйста, введите название.'); return; }
  const selGroups = Array.from(document.querySelectorAll('.group-chip.selected')).map(el => el.dataset.gid);
  const data = {
    title,
    year: document.getElementById('f-year').value.trim(),
    country: document.getElementById('f-country').value.trim(),
    maker: document.getElementById('f-maker').value.trim(),
    condition: document.getElementById('f-condition').value,
    acquired: document.getElementById('f-acquired').value,
    value: document.getElementById('f-value').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    photos: [...editingPhotos],
    groups: selGroups,
  };
  if (editingItem) {
    Object.assign(editingItem, data);
  } else {
    items.push({ id: Date.now().toString(), num: items.length + 1, ...data });
  }
  save(); closeModal(); render();
}

// ─── DETAIL ───────────────────────────────────────────────────────────────────
function openDetail(id) {
  const item = items.find(i => i.id===id);
  if (!item) return;
  const itemGroups = (item.groups||[]).map(gid => groups.find(g => g.id===gid)).filter(Boolean);
  const fields = [
    ['Год', item.year], ['Страна', item.country],
    ['Производитель', item.maker], ['Состояние', item.condition],
    ['Как получено', item.acquired], ['Оценочная стоимость', item.value ? `$${item.value}` : null],
  ].filter(([,v]) => v);
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px">
      <div class="modal-title" style="margin:0">${esc(item.title)}</div>
      <span style="font-size:0.68rem;color:var(--muted)">#${item.num}</span>
    </div>
    ${item.photos && item.photos.length ? `<div class="detail-photos">${item.photos.map(src=>`<div class="detail-photo" onclick="openLightbox('${src}')"><img src="${src}" alt=""></div>`).join('')}</div>` : ''}
    ${fields.length ? `<div class="detail-grid">${fields.map(([l,v])=>`<div class="detail-cell"><div class="detail-field-label">${l}</div><div class="detail-field-value">${esc(v)}</div></div>`).join('')}</div>` : ''}
    ${item.notes ? `<div class="detail-notes"><div class="detail-field-label">Заметки</div><div style="font-size:0.82rem;line-height:1.5;margin-top:3px">${esc(item.notes)}</div></div>` : ''}
    ${itemGroups.length ? `<div style="margin-bottom:12px"><div class="detail-field-label">Группы</div><div class="card-tags" style="margin-top:5px">${itemGroups.map(g=>`<span class="tag">${esc(g.name)}</span>`).join('')}</div></div>` : ''}
    <div class="form-actions">
      <button class="btn btn-primary" onclick="closeModal();openEditItem('${item.id}')">Изменить</button>
      <button class="btn btn-danger" onclick="deleteItem('${item.id}')">Удалить</button>
      <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
    </div>
  `);
}

function deleteItem(id) {
  if (!confirm('Удалить этот набор навсегда?')) return;
  items = items.filter(i => i.id !== id);
  save(); closeModal(); render();
}

// ─── GROUPS ───────────────────────────────────────────────────────────────────
function openAddGroup() { showGroupForm(null); }
function openEditGroup(id) { showGroupForm(groups.find(g => g.id===id)); }

function showGroupForm(group) {
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${group ? 'Редактировать группу' : 'Новая группа'}</div>
    <div class="form-row">
      <label class="form-label">Название группы</label>
      <input class="form-input" id="g-name" value="${esc(group?.name||'')}" placeholder="напр. Германия, Животные, Фольклор…" autofocus>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveGroup('${group?.id||''}')">Сохранить</button>
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    </div>
  `);
}

function saveGroup(id) {
  const name = document.getElementById('g-name').value.trim();
  if (!name) return;
  if (id) { const g = groups.find(g => g.id===id); if (g) g.name = name; }
  else groups.push({ id: Date.now().toString(), name });
  save(); closeModal(); render();
}

function deleteGroup(id) {
  if (!confirm('Удалить группу? Наборы останутся.')) return;
  groups = groups.filter(g => g.id !== id);
  items = items.map(i => ({ ...i, groups: (i.groups||[]).filter(gid => gid !== id) }));
  save(); render();
}

// ─── LIGHTBOX ─────────────────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
